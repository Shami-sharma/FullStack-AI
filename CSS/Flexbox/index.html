<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
          .container{
            background-color: beige;
            border: 5px solid black;
            margin: 2px;
            padding: 2px;
            display: flex;
            flex-direction: row;
            height: 500px;
            align-items: center;

          }
          .Box{
            color: black;
            font-size: medium;
            text-align: center;
            height: 200px;
            width: 200px;
            border: 2px solid black;
            margin: 2px;
            padding: 2px;
          }
          #box1{
            background-color: aqua;
          }
          #box2{
            background-color: blue;
          }
          #box3{
            background-color: blueviolet;
          }
          #box4{
            background-color: brown;
          }
    </style>
</head>

  <body>
       <div class="container">
        <div class="Box" id="box1">Name</div>
        <div class="Box" id="box2">Shami</div>
        <div class="Box" id="box3">Kumar</div>
        <div class="Box" id="box4">sharma</div>
        
       </div>
  </body>
</html>
