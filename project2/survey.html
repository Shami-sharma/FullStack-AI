<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>code_shami</title>
</head>
<body>
    <form>
        <h1>survey </h1>
        <div>
            <input type="text" placeholder="first Name">
            <input type="text" placeholder="Middle Name">
            <input type="text" placeholder="Last Name">
        </div>
        <br />
        <div>
            <input type="text" placeholder="Address  1">
            <input type="text" placeholder="Adrress  2">
        </div><br/>
        <div>
            <input type="email" placeholder="Email">
            <input type="number" placeholder="Phone Number">
        </div>
        <div>
            <fieldset>
                <legend>What is your gender?</legend>
                <input type="radio" id="male" name="GENDER">
                <label for="male">MALE</label>
                <input type="radio" id="female" name="GENDER">
                <label for="female">FEMALE</label>
            </fieldset>
        </div>
        <br/>
        <label for="comments">Comments</label><br />
        <textarea id="comments" name="comments" minlength="100" placeholder="Enter your comments here"></textarea>
        <br/>
        <input type="submit" value="SUBMIT" title="Submit survey form" />
    </form>
</body>
</html>
